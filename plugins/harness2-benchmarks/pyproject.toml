[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2-benchmarks"
version = "0.1.0"
description = "The Harness² paper benchmarks (JobBench, LAB, WorkBuddy-Bench) as harness2 suites"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["harness2-cli"]

[project.optional-dependencies]
render = ["openpyxl>=3.1,<4", "python-pptx>=1,<2"]

[project.entry-points."harness2.suites"]
jb = "harness2_benchmarks.suites.jb"
lab = "harness2_benchmarks.suites.lab"
wb-office = "harness2_benchmarks.suites.wb_office"
wb-web = "harness2_benchmarks.suites.wb_web"
wb-code = "harness2_benchmarks.suites.wb_code"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["harness2_benchmarks*"]
namespaces = false

[tool.setuptools.package-data]
harness2_benchmarks = ["third_party/**/*", "dependencies_meta/**/*"]
